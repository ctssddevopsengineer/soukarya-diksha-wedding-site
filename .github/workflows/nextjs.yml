name: Deploy Next.js site to Pages

on:
  push:
    branches: ["feature/phase2b"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: unt
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      GOOGLE_MAPS_URL: ${{ vars.GOOGLE_MAPS_URL }}
      VENUE_NAME: ${{ vars.VENUE_NAME }}
      VENUE_ADDRESS: ${{ vars.VENUE_ADDRESS }}
      GROOM_NAME: ${{ vars.GROOM_NAME }}
      BRIDE_NAME: ${{ vars.BRIDE_NAME }}
      GROOM_FATHER_NAME: ${{ vars.GROOM_FATHER_NAME }}
      GROOM_MOTHER_NAME: ${{ vars.GROOM_MOTHER_NAME }}
      BRIDE_FATHER_NAME: ${{ vars.BRIDE_FATHER_NAME }}
      BRIDE_MOTHER_NAME: ${{ vars.BRIDE_MOTHER_NAME }}
      GROOM_FAMILY_CONTACT_NAME: ${{ vars.GROOM_FAMILY_CONTACT_NAME }}
      GROOM_FAMILY_PHONE_NUMBER: ${{ vars.GROOM_FAMILY_PHONE_NUMBER }}
      BRIDE_FAMILY_CONTACT_NAME: ${{ vars.BRIDE_FAMILY_CONTACT_NAME }}
      BRIDE_FAMILY_PHONE_NUMBER: ${{ vars.BRIDE_FAMILY_PHONE_NUMBER }}
      EVENT_TIMEZONE: ${{ vars.EVENT_TIMEZONE }}
      EVENT_TIMEZONE_OFFSET: ${{ vars.EVENT_TIMEZONE_OFFSET }}
      EVENT_START_DATE: ${{ vars.EVENT_START_DATE }}
      EVENT_START_TIME: ${{ vars.EVENT_START_TIME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Render invitation configuration
        run: npm run config:render

      - name: Verify no unresolved placeholders remain
        run: |
          if grep -R -n -E '\{\{[A-Z0-9_]+\}\}' lib/event.mjs; then
            echo "Unresolved event placeholders detected"
            exit 1
          fi

      - name: Run unit tests
        run: npm test

      - name: Run Phase 2B tests
        run: npm run test:phase2b

      - name: Build with Next.js
        run: npm run build

      - name: Verify GitHub Pages base path in export
        run: |
          test -f out/index.html
          grep -R "${NEXT_PUBLIC_BASE_PATH}/_next/" out/index.html

      - name: Verify theme artwork exists in export
        run: |
          test -f out/themes/navy/front.png
          test -f out/themes/classic/front.png
          test -f out/images/location-qr.png

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
