name: Deploy Next.js site to Pages

on:
  push:
    branches: ["feature/phase2b"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Phase 2B tests
        run: npm run test:phase2b

      - name: Build with Next.js
        run: npm run build

      - name: Verify GitHub Pages base path in export
        run: |
          test -f out/index.html
          grep -R "${NEXT_PUBLIC_BASE_PATH}/_next/" out/index.html

      - name: Verify theme artwork exists in export
        run: |
          test -f out/themes/navy/front.png
          test -f out/themes/classic/front.png
          test -f out/images/location-qr.png

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
