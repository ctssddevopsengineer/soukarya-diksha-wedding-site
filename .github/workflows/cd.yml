name: Deploy to GitHub Pages

on:
  push:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@v5
        with:
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          path: ~/.npm
          restore-keys: |
            npm-${{ runner.os }}-
            npm-
    
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build

      - name: Verify static export
        run: test -f out/index.html

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: out/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment: unt
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: github-pages
    
      - name: replace placeholders in event.mjs
        run: |
          # using a loop and regex
            for file in lib/event.mjs; do
                sed -i "s|{{GOOGLE_MAPS_URL}}|${{ vars.GOOGLE_MAPS_URL }}|g" "$file"
                sed -i "s|{{VENUE_NAME}}|${{ vars.VENUE_NAME }}|g" "$file"
                sed -i "s|{{VENUE_ADDRESS}}|${{ vars.VENUE_ADDRESS }}|g" "$file"
                sed -i "s|{{GROOM_NAME}}|${{ vars.GROOM_NAME }}|g" "$file"
                sed -i "s|{{BRIDE_NAME}}|${{ vars.BRIDE_NAME }}|g" "$file"
                sed -i "s|{{GROOM_FATHER_NAME}}|${{ vars.GROOM_FATHER_NAME }}|g" "$file"
                sed -i "s|{{GROOM_MOTHER_NAME}}|${{ vars.GROOM_MOTHER_NAME }}|g" "$file"
                sed -i "s|{{BRIDE_FATHER_NAME}}|${{ vars.BRIDE_FATHER_NAME }}|g" "$file"
                sed -i "s|{{BRIDE_MOTHER_NAME}}|${{ vars.BRIDE_MOTHER_NAME }}|g" "$file"
                sed -i "s|{{GROOM_FAMILY_CONTACT_NAME}}|${{ vars.GROOM_FAMILY_CONTACT_NAME }}|g" "$file"
                sed -i "s|{{GROOM_FAMILY_PHONE_NUMBER}}|${{ vars.GROOM_FAMILY_PHONE_NUMBER }}|g" "$file"
                sed -i "s|{{BRIDE_FAMILY_CONTACT_NAME}}|${{ vars.BRIDE_FAMILY_CONTACT_NAME }}|g" "$file"
                sed -i "s|{{BRIDE_FAMILY_PHONE_NUMBER}}|${{ vars.BRIDE_FAMILY_PHONE_NUMBER }}|g" "$file"
                sed -i "s|{{EVENT_TIMEZONE}}|${{ vars.EVENT_TIMEZONE }}|g" "$file"
                sed -i "s|{{EVENT_TIMEZONE_OFFSET}}|${{ vars.EVENT_TIMEZONE_OFFSET }}|g" "$file"
                sed -i "s|{{EVENT_START_DATE}}|${{ vars.EVENT_START_DATE }}|g" "$file"
                sed -i "s|{{EVENT_START_TIME}}|${{ vars.EVENT_START_TIME }}|g" "$file"
              done
    
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
