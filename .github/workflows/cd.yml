name: Deploy GitHub Pages

on:
  push:
    branches:
      - development
      - master
      - release/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: unt
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Render invitation configuration
        env:
          EVENT_TIMEZONE: ${{ vars.EVENT_TIMEZONE }}
          EVENT_TIMEZONE_OFFSET: +05:30
          EVENT_START_DATE: '2027-01-23'
          EVENT_START_TIME: '19:00:00'
          GOOGLE_MAPS_URL: https://maps.app.goo.gl/QXBrYKXfHC27pNAj8
          VENUE_NAME: HRS Bhawan
          VENUE_ADDRESS: 92, Artillary Road, Cantonment, Barrackpore, West Bengal 700120
          GROOM_NAME: Soukarya
          BRIDE_NAME: Diksha
          GROOM_FATHER_NAME: Somnath Datta
          GROOM_MOTHER_NAME: Nirjhara Datta
          BRIDE_FATHER_NAME: Sri Krishna Bhujel
          BRIDE_MOTHER_NAME: Late Durgamaya Bhujel
          GROOM_FAMILY_CONTACT_NAME: Groom Family
          GROOM_FAMILY_PHONE_NUMBER: '+910000000000'
          BRIDE_FAMILY_CONTACT_NAME: Bride Family
          BRIDE_FAMILY_PHONE_NUMBER: '+910000000001'
        run: npm run config:render

      - name: Build static export
        run: npm run build

      - name: Validate GitHub Pages-compatible export
        run: npm run validate:export

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
