name: CI

on:
  push:
    branches:
      - feature/phase2b
  pull_request:
    branches:
      - development
      - master
      - release/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Tests and GitHub Pages-compatible build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        env:
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm test

      - name: Phase 2B tests
        env:
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm run test:phase2b

      # CI uses neutral fixture values only to prove that the deployment template
      # can be rendered and exported. Production values come from environment vars.
      - name: Render CI invitation configuration
        env:
          EVENT_TIMEZONE: Asia/Kolkata
          EVENT_TIMEZONE_OFFSET: +05:30
          EVENT_START_DATE: '2027-01-23'
          EVENT_START_TIME: '19:00:00'
          GOOGLE_MAPS_URL: https://maps.example.test/venue
          VENUE_NAME: Sample Venue
          VENUE_ADDRESS: Sample Address, Sample City, India
          GROOM_NAME: Groom
          BRIDE_NAME: Bride
          GROOM_FATHER_NAME: Groom Father
          GROOM_MOTHER_NAME: Groom Mother
          BRIDE_FATHER_NAME: Bride Father
          BRIDE_MOTHER_NAME: Bride Mother
          GROOM_FAMILY_CONTACT_NAME: Groom Family Contact
          GROOM_FAMILY_PHONE_NUMBER: '+910000000000'
          BRIDE_FAMILY_CONTACT_NAME: Bride Family Contact
          BRIDE_FAMILY_PHONE_NUMBER: '+910000000001'
        run: npm run config:render

      - name: Build GitHub Pages-compatible static export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Validate GitHub Pages-compatible export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run validate:export

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: out/
          if-no-files-found: error
