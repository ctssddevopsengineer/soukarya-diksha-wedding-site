name: CI

on:
  pull_request:
    branches:
      - development
      - master
      - release/**
  push:
    branches:
      - feature/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Tests and GitHub Pages-compatible build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render CI invitation configuration
        env:
          EVENT_TIMEZONE: Asia/Kolkata
          EVENT_TIMEZONE_OFFSET: +05:30
          EVENT_START_DATE: '2027-01-23'
          EVENT_START_TIME: '19:00:00'
          GOOGLE_MAPS_URL: https://maps.app.goo.gl/QXBrYKXfHC27pNAj8
          VENUE_NAME: HRS Bhawan
          VENUE_ADDRESS: 92, Artillary Road, Cantonment, Barrackpore, West Bengal 700120
          GROOM_NAME: Soukarya
          BRIDE_NAME: Diksha
          GROOM_FATHER_NAME: Somnath Datta
          GROOM_MOTHER_NAME: Nirjhara Datta
          BRIDE_FATHER_NAME: Sri Krishna Bhujel
          BRIDE_MOTHER_NAME: Late Durgamaya Bhujel
          GROOM_FAMILY_CONTACT_NAME: Groom Family
          GROOM_FAMILY_PHONE_NUMBER: '+910000000000'
          BRIDE_FAMILY_CONTACT_NAME: Bride Family
          BRIDE_FAMILY_PHONE_NUMBER: '+910000000001'
        run: npm run config:render

      - name: Unit tests
        run: npm test

      - name: Phase 2B tests
        run: npm run test:phase2b

      - name: Build static export
        run: npm run build

      - name: Validate GitHub Pages-compatible export
        run: npm run validate:export

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-compatible-export
          path: out/
          if-no-files-found: error
